:root{--ink:#14303F;--cream:#FFF8EC;--gold:#FFC93C;--coral:#F26B3A;--display:"Fredoka",system-ui,sans-serif;--ui:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden;background:#0B3442;color:#fff;font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
#hud{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px;position:relative;z-index:3}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px 0 6px;border-radius:999px;background:rgba(6,30,42,.5);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.pill svg{width:28px;height:28px;flex:none}
#lvl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.02;pointer-events:none;white-space:nowrap}
#lvl b{display:block;font-family:var(--display);font-weight:700;font-size:23px;text-shadow:0 2px 0 rgba(0,0,0,.28)}
#lvl small{display:block;margin-top:2px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9;text-shadow:0 1px 0 rgba(0,0,0,.35)}
#lvl small.hard{color:#FFD45E}
.btns{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(6,30,42,.5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff}
.icon-btn svg{width:22px;height:22px}
#stage{position:relative;flex:1 1 auto;min-height:0;z-index:1}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#boosters{position:absolute;display:flex;gap:14px;z-index:2}
.boost{position:relative;width:60px;height:60px;border-radius:19px;border:0;background:linear-gradient(#FFE38F,#F2B53C);box-shadow:0 4px 0 #A9741A,0 7px 14px rgba(0,0,0,.28);display:grid;place-items:center;cursor:pointer;color:#5A3A00;padding:0;font:inherit}
.boost:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #A9741A,0 3px 8px rgba(0,0,0,.25)}
.boost svg{width:32px;height:32px}
.boost .n{position:absolute;right:-7px;top:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#E2533F;color:#fff;font-weight:900;font-size:14px;line-height:24px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.boost .n.plus{background:#2E8B62;font-size:17px}
.boost .cap{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:7px;font-size:11.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.boost:disabled{filter:grayscale(.55);opacity:.7;cursor:default}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:9px 15px;border-radius:13px;background:rgba(8,24,34,.9);font-weight:900;font-size:15px;line-height:1.25;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:4}
#toast.show{opacity:1}
#coach{position:absolute;left:50%;transform:translateX(-50%);max-width:min(340px,calc(100% - 24px));padding:10px 15px;border-radius:14px;background:#FFF8EC;color:var(--ink);font-weight:900;font-size:15.5px;line-height:1.3;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.25);pointer-events:none;z-index:4}
#hand{position:absolute;width:54px;height:54px;pointer-events:none;z-index:5;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
@keyframes tap{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4px,7px) scale(.92)}}
@media (prefers-reduced-motion:reduce){#hand{animation:none}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .35s}
#banner.show{opacity:1}
#banner b{display:inline-block;padding:6px 22px 8px;border-radius:20px;background:rgba(6,30,42,.62);font-family:var(--display);font-weight:700;font-size:40px;color:#fff;text-shadow:0 3px 0 rgba(10,40,55,.6)}
#banner small{display:block;width:max-content;margin:8px auto 0;padding:4px 12px;border-radius:999px;background:rgba(6,30,42,.55);font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#modal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(4,22,32,.55);z-index:10}
#modal[hidden]{display:none}
.card{width:min(360px,100%);padding:22px 20px 20px;border-radius:24px;background:#FFF8EC;color:var(--ink);text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18),0 20px 50px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1}
.card p{margin:0 0 14px;font-weight:800;font-size:15.5px;line-height:1.35;color:#3A5260}
.card .big{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 16px;font-family:var(--display);font-weight:700;font-size:36px;color:#B47A00}
.card .big svg{width:40px;height:40px}
.card .rows{margin:-6px 0 14px;font-weight:800;font-size:14px;color:#56707E}
.card .rows div{display:flex;justify-content:space-between;padding:3px 10px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:#fff;background:#2E8B87;box-shadow:0 4px 0 #1C5F5C}
.mb:active{transform:translateY(3px);box-shadow:0 1px 0 #1C5F5C}
.mb.ad{background:#F2A532;box-shadow:0 4px 0 #A9741A;color:#3B2600}
.mb.ad:active{box-shadow:0 1px 0 #A9741A}
.mb.ghost{background:transparent;color:#4E6A78;box-shadow:none;min-height:40px;font-size:16px}
.mb.coin{background:#FFE7A3;color:#6A4A00;box-shadow:0 4px 0 #D1A94A}
.mb svg{width:24px;height:24px;flex:none}
.mb small{display:block;font-size:12px;font-weight:800;opacity:.85}
.mb:disabled{opacity:.45;cursor:default}
#adFake{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#fff;font-weight:900;font-size:18px;z-index:20;letter-spacing:.06em}
#coverTitle{position:absolute;pointer-events:none;z-index:6;font-family:var(--display);font-weight:700;color:#fff;line-height:.9;-webkit-text-stroke:1.3vmin #0E3A4C;paint-order:stroke fill;text-shadow:0 1.3vmin 0 #0E3A4C}
.cover #hud,.cover #boosters{display:none}
</style>

    LV = { n: 1 };
    // where things go on each cover (title kept clear of CrazyGames' top-left label area)
    var box = land ? { l: 0.5, t: 0.08, w: 0.46, h: 0.64 } : sq ? { l: 0.08, t: 0.34, w: 0.84, h: 0.44 } : { l: 0.06, t: 0.36, w: 0.88, h: 0.41 };
    var sp = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 };
    tiles.forEach(function (t) { var ux = t.x * 0.52 - t.z * DZ, uy = t.y * (FACE + THK) / 2 - t.z * DZ; sp.x0 = Math.min(sp.x0, ux); sp.x1 = Math.max(sp.x1, ux + 1); sp.y0 = Math.min(sp.y0, uy); sp.y1 = Math.max(sp.y1, uy + FACE + THK); });
    var bw = W * box.w, bh = H * box.h;
    geo.S = Math.min(bw / (sp.x1 - sp.x0), bh / (sp.y1 - sp.y0));
    geo.ox = W * box.l + (bw - (sp.x1 - sp.x0) * geo.S) / 2 - sp.x0 * geo.S;
    geo.oy = H * box.t + (bh - (sp.y1 - sp.y0) * geo.S) / 2 - sp.y0 * geo.S;
    geo.slotS = land ? H * 0.105 : sq ? W * 0.1 : W * 0.105;
    geo.gap = geo.slotS * 0.09; geo.pad = geo.slotS * 0.16;
    geo.trayW = 7 * geo.slotS + 6 * geo.gap + geo.pad * 2; geo.trayH = geo.slotS * (FACE + THK) + geo.pad * 2;
    geo.trayX = land ? W * 0.5 + (W * 0.46 - geo.trayW) / 2 : (W - geo.trayW) / 2;
    geo.trayY = H - geo.trayH - (land ? H * 0.07 : H * 0.05);
    spriteS = Math.max(geo.S, geo.slotS) * 1.3; spriteDPR = DPR; sprites = {};
    function drawCoverNow() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
      order.forEach(function (t) { var p = boardPos(t); var free = !t.above.length; blit(t.pic, !free, p.x, p.y, geo.S, 1); });
      drawTray(0);
      var p0 = slotPos(0), p1 = slotPos(1), p2 = slotPos(2);
      blit(0, false, p0.x, p0.y, geo.slotS, 1); blit(0, false, p1.x, p1.y, geo.slotS, 1);
      // the third lobster on its way in, with a little sparkle
      var fx = p2.x + geo.slotS * 0.25, fy = p2.y - geo.slotS * 1.25;
      ctx.save(); ctx.translate(fx + geo.slotS / 2, fy + geo.slotS * 0.6); ctx.rotate(-0.16); ctx.translate(-(fx + geo.slotS / 2), -(fy + geo.slotS * 0.6));
      blit(0, false, fx, fy, geo.slotS * 1.08, 1); ctx.restore();
      ctx.fillStyle = "#FFF3B0";
      [[0.95, -0.3, 0.13], [-0.18, 0.05, 0.09], [1.12, 0.55, 0.08], [0.4, -0.55, 0.07]].forEach(function (s2) {
        var cx = fx + geo.slotS * s2[0], cy = fy + geo.slotS * s2[1], r2 = geo.slotS * s2[2];
        ctx.beginPath(); ctx.moveTo(cx, cy - r2 * 2.2); ctx.lineTo(cx + r2 * 0.6, cy); ctx.lineTo(cx, cy + r2 * 2.2); ctx.lineTo(cx - r2 * 0.6, cy); ctx.closePath(); ctx.fill();
      });
      // title
      var fsz = land ? H * 0.2 : sq ? H * 0.135 : W * 0.17;
      var tx = land ? W * 0.055 : W / 2, ty = land ? H * 0.3 : sq ? H * 0.07 : H * 0.118;
      ctx.textAlign = land ? "left" : "center"; ctx.textBaseline = "top";
      ctx.font = "700 " + fsz + "px Fredoka, sans-serif";
      var lines = ["Tidepool", "Tiles"];
      if (sq) { ctx.textAlign = "right"; tx = W * 0.95; }
      lines.forEach(function (ln, i) {
        var yy = ty + i * fsz * 0.98;
        ctx.lineJoin = "round"; ctx.lineWidth = fsz * 0.16; ctx.strokeStyle = "#0E3A4C";
        ctx.save(); ctx.translate(0, fsz * 0.08); ctx.strokeText(ln, tx, yy); ctx.fillStyle = "#0E3A4C"; ctx.fillText(ln, tx, yy); ctx.restore();
        ctx.strokeText(ln, tx, yy);
        var g = ctx.createLinearGradient(0, yy, 0, yy + fsz); g.addColorStop(0, "#FFFFFF"); g.addColorStop(1, "#FFE9B8");
        ctx.fillStyle = g; ctx.fillText(ln, tx, yy);
      });
    }
    drawCoverNow();
    requestAnimationFrame(drawCoverNow);
  }

  if (DEBUG) window.__tp = {
    state: function () { return { level: LV && LV.n, state: G.state, tray: tray.map(function (u) { return u.pic; }), side: side.length, left: remaining(), coins: S.coins, b: S.b, cls: G.cls, S: geo.S }; },
    free: function () {
      var out = tiles.filter(function (t) { return t.where === "board" && isFree(t) && !t.intro && !t.fly; }).map(function (t) { var p = boardPos(t); return { id: t.id, pic: t.pic, x: p.x + geo.S / 2, y: p.y + geo.S * 0.6 }; });
      side.forEach(function (t, i) { if (!t.fly) { var p = sidePos(i); out.push({ id: t.id, pic: t.pic, x: p.x + geo.sideS / 2, y: p.y + geo.sideS * 0.6, side: true }); } });
      return out;
    },
    tap: function (id) { var t = tiles[id]; if (!t) return; if (t.where === "side") tapTile(t, true); else if (t.where === "board" && isFree(t)) tapTile(t, false); },
    solution: function () { return LV.solution.slice(); },
    goto: function (n) { closeModal(); S.level = n; startLevel(n); },
    set: function (o) { Object.assign(S, o); updateUI(); },
    S: function () { return S; },
    geo: function () { return geo; }
  };
  boot();
})();
</script>
